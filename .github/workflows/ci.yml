name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - name: Configurar cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build, testes e lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Guardar APK e relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
